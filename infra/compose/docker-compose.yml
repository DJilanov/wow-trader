name: wow-trader

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wow_trader
      POSTGRES_PASSWORD: wow_trader
      POSTGRES_USER: wow_trader
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wow_trader -d wow_trader"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: wow-trader-local-secret
      MINIO_ROOT_USER: wow-trader
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
  postgres-data:
  redis-data:
