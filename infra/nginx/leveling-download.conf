location = /tools/forever/leveling/download {
    limit_req zone=kfc_tools_search_crawlers burst=10 nodelay;
    alias /home/wow-trader-system/shared/leveling-download/current/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    limit_except GET {
        deny all;
    }
}

location = /tools/forever/leveling/download/ {
    return 308 /tools/forever/leveling/download;
}
