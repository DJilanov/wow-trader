map $http_user_agent $kfc_guild_blocked_crawler {
    default 0;
    ~*Googlebot 0;
    ~*Bingbot 0;
    ~*OAI-SearchBot 0;
    ~*(bot|crawler|spider|slurp) 1;
}

map $http_user_agent $kfc_tools_search_crawler_key {
    default "";
    ~*Googlebot $binary_remote_addr;
    ~*Bingbot $binary_remote_addr;
    ~*OAI-SearchBot $binary_remote_addr;
}

limit_req_zone $kfc_tools_search_crawler_key zone=kfc_tools_search_crawlers:10m rate=30r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.kfcguild.online;

    ssl_certificate /etc/letsencrypt/live/kfcguild.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kfcguild.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://kfcguild.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kfcguild.online;

    if ($kfc_guild_blocked_crawler) {
        return 403;
    }

    ssl_certificate /etc/letsencrypt/live/kfcguild.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kfcguild.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm text/x-component;

    # No matches until a checksum-verified delivery release is activated.
    include /home/wow-trader-system/shared/static-delivery/current/nginx-*.conf;

    # Old wizard history entries must resolve to the Helper, not the guild application's 404.
    location = /forever/leveling {
        return 308 https://kfcguild.online/tools$request_uri;
    }
    location /forever/leveling/ {
        return 308 https://kfcguild.online/tools$request_uri;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location = /tools {
        limit_req zone=kfc_tools_search_crawlers burst=10 nodelay;
        proxy_pass http://127.0.0.1:19210;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /tools/ {
        limit_req zone=kfc_tools_search_crawlers burst=10 nodelay;
        proxy_pass http://127.0.0.1:19210;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Reviewed bundles keep this immutable asset namespace, independent of the Helper base path.
    location /forever-sim/ {
        limit_req zone=kfc_tools_search_crawlers burst=10 nodelay;
        proxy_pass http://127.0.0.1:19210/tools/forever-sim/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:19200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name kfcguild.online www.kfcguild.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://kfcguild.online$request_uri;
    }
}
