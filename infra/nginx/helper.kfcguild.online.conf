limit_req_zone $binary_remote_addr zone=kfc_helper_ingest:10m rate=10r/m;
map $http_user_agent $kfc_helper_blocked_crawler {
    default 0;
    ~*Googlebot 0;
    ~*Bingbot 0;
    ~*OAI-SearchBot 0;
    ~*ChatGPT-User 0;
    ~*PerplexityBot 0;
    ~*ClaudeBot 0;
    ~*anthropic-ai 0;
    ~*Claude-Web 0;
    ~*(bot|crawler|spider|slurp) 1;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name helper.kfcguild.online;

    client_max_body_size 32m;
    limit_req_status 429;

    if ($kfc_helper_blocked_crawler) {
        return 403;
    }

    ssl_certificate /etc/letsencrypt/live/helper.kfcguild.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helper.kfcguild.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location = /health {
        return 404;
    }

    location ^~ /docs {
        return 404;
    }

    location /v1/ {
        limit_req zone=kfc_helper_ingest burst=5 nodelay;
        proxy_pass http://127.0.0.1:19211;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
    }

    # Keep already-open legacy pages functional while all navigations move to the apex host.
    location /api/ {
        proxy_pass http://127.0.0.1:19210/tools/api/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = / {
        return 301 https://kfcguild.online/tools;
    }

    location = /tools {
        return 301 https://kfcguild.online/tools;
    }

    location /tools/ {
        return 301 https://kfcguild.online$request_uri;
    }

    location / {
        return 301 https://kfcguild.online/tools$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name helper.kfcguild.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /v1/ {
        return 308 https://helper.kfcguild.online$request_uri;
    }

    location = /tools {
        return 301 https://kfcguild.online/tools;
    }

    location /tools/ {
        return 301 https://kfcguild.online$request_uri;
    }

    location / {
        return 301 https://kfcguild.online/tools$request_uri;
    }
}
