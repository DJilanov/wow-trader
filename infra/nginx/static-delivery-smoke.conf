pid nginx-smoke.pid;
error_log stderr notice;
daemon off;

events {
    worker_connections 128;
}

http {
    map $http_user_agent $kfc_tools_search_crawler_key {
        default "";
        ~*Googlebot $binary_remote_addr;
        ~*Bingbot $binary_remote_addr;
        ~*OAI-SearchBot $binary_remote_addr;
    }
    limit_req_zone $kfc_tools_search_crawler_key zone=kfc_tools_search_crawlers:1m rate=30r/m;

    access_log off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml;

    server {
        listen 127.0.0.1:19876;
        server_name localhost;
        include nginx-locations*.conf;
        location / {
            return 404;
        }
    }
}
