name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: dotnet restore tools/extractor-dotnet/WowTrader.Extractor.csproj
      - run: dotnet format tools/extractor-dotnet/WowTrader.Extractor.csproj --verify-no-changes --no-restore
      - run: dotnet build tools/extractor-dotnet/WowTrader.Extractor.csproj --configuration Release --no-restore
